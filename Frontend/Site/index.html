<!DOCTYPE html>
<!--
  Dashboard web principal.
  Estrutura: sidebar de navegacao, topbar de filtros e area dinamica renderizada por script.js.
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plus Midia - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-logo">
        <img src="./pluslogo - Copia.svg" alt="Plus Midia" class="logo-img">
    </div>
    <nav class="sidebar-nav" aria-label="Menu principal do painel">
        <p class="nav-section-label">VISAO GERAL</p>
        <a href="#" class="nav-item active" data-section="dashboard">
            <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="7" height="7" rx="1"/><rect x="11" y="2" width="7" height="7" rx="1"/><rect x="2" y="11" width="7" height="7" rx="1"/><rect x="11" y="11" width="7" height="7" rx="1"/></svg>
            <span>Dashboard</span>
        </a>

        <p class="nav-section-label">AVALIACOES</p>
        <a href="#" class="nav-item" data-section="clients">
            <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1"/><circle cx="10" cy="7" r="4"/></svg>
            <span>Clientes</span>
        </a>
        <a href="#" class="nav-item" data-section="answers">
            <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Respostas</span>
        </a>
        <a href="#" class="nav-item" data-section="comments">
            <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="18" y2="6"/><line x1="8" y1="10" x2="18" y2="10"/><line x1="8" y1="14" x2="14" y2="14"/><circle cx="4" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="10" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="14" r="1.2" fill="currentColor" stroke="none"/></svg>
            <span>Comentarios</span>
        </a>

        <p class="nav-section-label">ANALISE</p>
        <a href="#" class="nav-item" data-section="reports">
            <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16l4-2 4 2 4-2V4a2 2 0 0 0-2-2z"/></svg>
            <span>Relatorios</span>
        </a>
        <a href="#" class="nav-item" data-section="metrics">
            <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 19 9 5 6 12 2 12"/></svg>
            <span>Metricas</span>
        </a>

        <p class="nav-section-label">CONFIGURACOES</p>
        <a href="#" class="nav-item" data-section="settings">
            <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3"/><path d="M10 2v2"/><path d="M10 16v2"/><path d="M2 10h2"/><path d="M16 10h2"/><path d="M4.3 4.3l1.4 1.4"/><path d="M14.3 14.3l1.4 1.4"/><path d="M15.7 4.3l-1.4 1.4"/><path d="M5.7 14.3l-1.4 1.4"/></svg>
            <span>Configuracoes</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <button id="sidebar-collapse-btn" class="sidebar-collapse-btn" type="button" aria-label="Recolher menu">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 4 6 10 12 16"/><line x1="16" y1="4" x2="16" y2="16"/></svg>
            <span>Recolher menu</span>
        </button>
    </div>
</aside>

<main class="main">
    <header class="topbar">
        <button id="topbar-sidebar-toggle" class="topbar-menu" aria-label="Menu">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="17" y2="6"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="14" x2="17" y2="14"/></svg>
        </button>
        <div class="topbar-right">
            <div class="unit-filter-wrap">
                <label for="unit-filter" class="unit-filter-label" title="Selecionar unidade">
                    <img src="./icon-unit.png" alt="Unidades" class="unit-filter-icon">
                </label>
                <select id="unit-filter" class="unit-filter-select">
                    <option value="all">Todas as unidades</option>
                </select>
            </div>
            <div class="unit-filter-wrap">
                <label for="meal-filter" class="unit-filter-label" title="Selecionar refeicao">
                    <span class="filter-letter">M</span>
                </label>
                <select id="meal-filter" class="unit-filter-select">
                    <option value="all">Todas as refeicoes</option>
                    <option value="almoco">Almoco</option>
                    <option value="happy">Happy Hour</option>
                    <option value="jantar">Jantar</option>
                </select>
            </div>
            <div class="unit-filter-wrap">
                <label for="date-start-filter" class="unit-filter-label" title="Data inicial">
                    <span class="filter-letter">DI</span>
                </label>
                <input id="date-start-filter" type="date" class="unit-filter-select dashboard-date-filter" />
            </div>
            <div class="unit-filter-wrap">
                <label for="date-end-filter" class="unit-filter-label" title="Data final">
                    <span class="filter-letter">DF</span>
                </label>
                <input id="date-end-filter" type="date" class="unit-filter-select dashboard-date-filter" />
            </div>


            <button class="topbar-icon" aria-label="Notificacoes">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 8A5 5 0 0 0 5 8c0 4.5-2 5.5-2 5.5h14s-2-1-2-5.5"/><path d="M11.73 17a2 2 0 0 1-3.46 0"/></svg>
            </button>
            <button id="logout-btn" class="topbar-logout-btn" type="button">Sair</button>
            <div class="topbar-avatar">U</div>
        </div>
    </header>

    <div class="content">
        <div class="content-header">
            <h1 id="page-title">Dashboard</h1>
            <p id="page-subtitle">Resumo das avaliacoes recebidas.</p>
        </div>
        <div id="content"></div>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
